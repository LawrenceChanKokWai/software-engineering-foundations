name: Software Engineering Foundations CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  python:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        run: |
          python -m unittest discover -s python -p 'test_*.py' -v

  java:
    name: Java Compilation and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Java
        run: |
          mkdir -p build/java
          javac -d build/java java/Hello.java java/HelloTest.java

      - name: Run Java application and tests
        run: |
          java -cp build/java Hello
          java -ea -cp build/java HelloTest

  cpp:
    name: C++20 Compilation and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile C++20
        run: |
          mkdir -p build/cpp
          g++ -std=c++20 -Wall -Wextra -Wpedantic cpp/hello.cpp -o build/cpp/hello
          g++ -std=c++20 -Wall -Wextra -Wpedantic cpp/test_hello.cpp -o build/cpp/test_hello

      - name: Run C++ application and tests
        run: |
          ./build/cpp/hello
          ./build/cpp/test_hello
